services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_tracker
      POSTGRES_USER: postgres
      # Required; the backend also refuses the old default "postgres" (config.py).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    # No host port: only the backend reaches the database, over pt-network.
    # For psql/pg_dump use `docker compose exec postgres ...`.
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pt-network

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}@postgres:5432/portfolio_tracker
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env dosyasında tanımlı olmalı (en az 32 karakter)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SQL_ECHO: ${SQL_ECHO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE:-120}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS:-10}
      # Annual risk-free rate for the Sharpe ratio, as a decimal (0.40 = 40 %).
      RISK_FREE_RATE: ${RISK_FREE_RATE:-0.40}
      # Background price alert check; 0 turns it off.
      ALERT_CHECK_INTERVAL_SECONDS: ${ALERT_CHECK_INTERVAL_SECONDS:-60}
      # Read notifications older than this many days are deleted; 0 keeps them.
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
      # Secure refresh cookie; set false only for a plain-http deployment on a LAN address.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # nginx (the frontend container) fronts the API, so the real client address
      # is the last X-Forwarded-For entry. Used by the rate limiter.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    # No host port: the API is reached through nginx (http://localhost/api). Publishing
    # 8000 would let anyone who can reach it set X-Forwarded-For and dodge the per-address
    # rate limit. For Swagger or direct calls see docker-compose.override.yml in README.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    # Readiness (database reachable), not just liveness. The image has no curl, so use python.
    # start_period covers the Alembic migrations that run before uvicorn starts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pt-network

  # ─── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pt-network

volumes:
  postgres_data:
    driver: local

networks:
  pt-network:
    driver: bridge
